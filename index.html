<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MindMap Maker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
:root{--g1:#e6e3ff;--g2:#ffe3ef;--bg:#f5f6fb;--dot:#d3d7e6;--panel:#fff;--tx:#1d2233;--line:#8b94b5;--bd:#d8dbea;--ac:#5b5bf0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:#23244a;--g2:#3a2038;--bg:#12141c;--dot:#2a2e3d;--panel:#1c2030;--tx:#e8eaf4;--line:#6f7899;--bd:#33384c}}
:root[data-theme="dark"]{--g1:#23244a;--g2:#3a2038;--bg:#12141c;--dot:#2a2e3d;--panel:#1c2030;--tx:#e8eaf4;--line:#6f7899;--bd:#33384c}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:15px Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
#bar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--bd);box-shadow:0 4px 18px rgba(60,60,120,.1);align-items:center;z-index:5}
button,input{font:inherit;color:var(--tx)}
button{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}
button{transition:.15s}button:hover{border-color:var(--ac);transform:translateY(-1px)}button.p{background:linear-gradient(135deg,#6a5cff,#c04bff);color:#fff;border-color:transparent}button:disabled{opacity:.6}
#topic{flex:1;min-width:150px;max-width:300px;padding:6px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.sw{width:22px;height:22px;border-radius:50%;padding:0;border:2px solid var(--bd)}
#msg{font-size:12px;opacity:.75;margin-left:4px}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none;background:radial-gradient(circle at 15% 10%,var(--g1),transparent 50%),radial-gradient(circle at 88% 92%,var(--g2),transparent 50%),radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:auto,auto,24px 24px;cursor:grab}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#lines{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.n{position:absolute;transform:translate(-50%,-50%);padding:9px 16px;border-radius:16px;border:2px solid rgba(255,255,255,.75);color:#1d2233;font-weight:500;cursor:grab;user-select:none;white-space:nowrap;box-shadow:0 8px 20px rgba(60,60,120,.2);outline:none;transition:box-shadow .15s,transform .15s}
.n:hover{transform:translate(-50%,-50%) scale(1.06)}
.n.root{background:linear-gradient(135deg,#6a5cff,#c04bff)!important;color:#fff;font-size:18px;padding:12px 20px}
.n.sel{border-color:var(--ac);box-shadow:0 0 0 3px rgba(91,91,240,.35)}
select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px}
.n.s-rect{border-radius:4px}.n.s-pill{border-radius:999px;padding:8px 20px}.n.s-ellipse{border-radius:50%;padding:16px 28px}
.n.s-diamond{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);border:none;padding:26px 40px;box-shadow:none}
.n.s-hex{clip-path:polygon(15% 0,85% 0,100% 50%,85% 100%,15% 100%,0 50%);border:none;padding:12px 30px;box-shadow:none}
.n.sel.s-diamond,.n.sel.s-hex{filter:brightness(.88) saturate(1.4);text-decoration:underline}
#help{position:absolute;left:10px;bottom:10px;font-size:12px;opacity:.6;pointer-events:none}
</style></head><body>
<div id="bar">
<button id="undo" title="Undo (Ctrl+Z)">↶</button><button id="redo" title="Redo (Ctrl+Y)">↷</button>
<input id="topic" placeholder="Type a topic, e.g. Operating System">
<button class="p" id="gen">✨ Auto Generate</button>
<button id="add">+ Child</button><button id="sib">+ Sibling</button><button id="del">Delete</button>
<select id="shape" title="Node shape"><option value="round">▢ Rounded</option><option value="rect">■ Rectangle</option><option value="pill">⬭ Pill</option><option value="ellipse">⬯ Oval</option><option value="diamond">◆ Diamond</option><option value="hex">⬡ Hexagon</option></select><button id="allsh">Shape → All</button>
<span id="cols"></span>
<select id="pal" title="Color theme"><option>Pastel</option><option>Sunset</option><option>Ocean</option><option>Forest</option></select><button id="arr">✦ Auto Arrange</button><button id="ls">〰 Curved</button>
<button id="zi">＋</button><button id="zo">－</button><button id="fit">⤢ Fit</button>
<button id="png">PNG</button><button id="json">JSON</button><button id="clr">New</button><button id="th">🌓</button>
<span id="msg"></span>
</div>
<div id="stage"><div id="world"><svg id="lines"></svg></div>
<div id="help">Drag = move · Double click = edit · Tab = child · Enter = sibling · Wheel = zoom · Ctrl+Z = undo</div></div>
<script>
const $=s=>document.querySelector(s),PAL=['#ffd6e0','#ffe8b8','#d4f5c9','#c9e6ff','#e0d4ff','#ffffff'];
let S={nodes:[],sel:null,v:{x:0,y:0,k:1}},uid=1,els={},stage=$('#stage'),world=$('#world'),lines=$('#lines');
const get=id=>S.nodes.find(n=>n.id==id),kids=id=>S.nodes.filter(n=>n.p==id);
function msg(t){$('#msg').textContent=t}
function store(){try{localStorage.setItem('mm1',JSON.stringify({nodes:S.nodes,uid}))}catch(e){}}
let H=[],hi=-1,LS=false;
function commit(){const s=JSON.stringify(S.nodes);if(H[hi]===s)return;H=H.slice(0,hi+1);H.push(s);if(H.length>80)H.shift();hi=H.length-1}
function save(){commit();store()}
function go(d){const i=hi+d;if(i<0||i>=H.length)return;hi=i;S.nodes=JSON.parse(H[i]);if(!get(S.sel))S.sel=S.nodes[0].id;render();store()}
function load(){try{const d=JSON.parse(localStorage.getItem('mm1'));if(d&&d.nodes&&d.nodes.length){S.nodes=d.nodes;uid=d.uid||100;return true}}catch(e){}return false}
function fresh(t){S.nodes=[{id:uid++,t:t||'My Topic',x:0,y:0,c:'#5b5bf0',p:null}];S.sel=S.nodes[0].id}
function view(){world.style.transform=`translate(${S.v.x}px,${S.v.y}px) scale(${S.v.k})`}
function center(){S.v={x:stage.clientWidth/2,y:stage.clientHeight/2,k:1};view()}
function render(){
  world.querySelectorAll('.n').forEach(e=>e.remove());els={};
  S.nodes.forEach(n=>{const e=document.createElement('div');e.className='n s-'+(n.s||'round')+(n.p==null?' root':'')+(n.id==S.sel?' sel':'');
    e.textContent=n.t;e.style.background=n.c;e.dataset.id=n.id;world.appendChild(e);els[n.id]=e});
  layout()}
function layout(){
  let h='';S.nodes.forEach(n=>{const e=els[n.id];e.style.left=n.x+'px';e.style.top=n.y+'px';
    const p=get(n.p);if(p){const mx=(p.x+n.x)/2;h+=`<path d="${LS?`M${p.x} ${p.y} L${n.x} ${n.y}`:`M${p.x} ${p.y} C${mx} ${p.y},${mx} ${n.y},${n.x} ${n.y}`}" fill="none" stroke="var(--line)" stroke-width="3" stroke-linecap="round" opacity=".8"/>`}});
  lines.innerHTML=h}
function addChild(pid){
  const p=get(pid||S.sel)||S.nodes[0],par=get(p.p),c=kids(p.id).length;
  const base=par?Math.atan2(p.y-par.y,p.x-par.x):-Math.PI/2+c*1.1,off=par?(c%2?1:-1)*Math.ceil(c/2)*.55:0,a=base+off;
  const col=par?(p.p==S.nodes[0].id?p.c:p.c):PAL[c%5];
  const n={id:uid++,t:'New idea',s:$('#shape').value,x:Math.round(p.x+200*Math.cos(a)),y:Math.round(p.y+200*Math.sin(a)),c:col,p:p.id};
  S.nodes.push(n);S.sel=n.id;render();save();edit(n.id)}
function addSib(){const n=get(S.sel);if(!n||n.p==null)return addChild();addChild(n.p)}
function del(){const n=get(S.sel);if(!n||n.p==null)return msg('Main topic delete panna mudiyadhu — "New" use pannunga');
  const rm=new Set([n.id]);let go=true;while(go){go=false;S.nodes.forEach(m=>{if(!rm.has(m.id)&&rm.has(m.p)){rm.add(m.id);go=true}})}
  S.nodes=S.nodes.filter(m=>!rm.has(m.id));S.sel=n.p;render();save()}
function edit(id){const e=els[id];e.contentEditable=true;e.focus();getSelection().selectAllChildren(e);
  e.onblur=()=>{e.contentEditable=false;const n=get(id);n.t=e.textContent.trim()||'Idea';e.textContent=n.t;save()}}
// pointer: drag nodes / pan
let drag=null;
stage.addEventListener('pointerdown',ev=>{
  const t=ev.target.closest('.n');if(t&&t.isContentEditable)return;
  if(t){S.sel=+t.dataset.id;world.querySelectorAll('.n').forEach(e=>e.classList.toggle('sel',e==t));drag={n:get(S.sel),sx:ev.clientX,sy:ev.clientY,ox:get(S.sel).x,oy:get(S.sel).y}}
  else{S.sel=null;world.querySelectorAll('.n').forEach(e=>e.classList.remove('sel'));drag={pan:1,sx:ev.clientX,sy:ev.clientY,ox:S.v.x,oy:S.v.y}}});
addEventListener('pointermove',ev=>{if(!drag)return;const dx=ev.clientX-drag.sx,dy=ev.clientY-drag.sy;
  if(drag.pan){S.v.x=drag.ox+dx;S.v.y=drag.oy+dy;view()}else{drag.n.x=Math.round(drag.ox+dx/S.v.k);drag.n.y=Math.round(drag.oy+dy/S.v.k);layout()}});
addEventListener('pointerup',()=>{if(drag&&!drag.pan)save();drag=null});
stage.addEventListener('dblclick',ev=>{const t=ev.target.closest('.n');if(t)edit(+t.dataset.id)});
function zoom(f,cx,cy){const k=Math.min(2.5,Math.max(.25,S.v.k*f)),r=k/S.v.k;cx=cx??stage.clientWidth/2;cy=cy??stage.clientHeight/2;
  S.v.x=cx-(cx-S.v.x)*r;S.v.y=cy-(cy-S.v.y)*r;S.v.k=k;view()}
stage.addEventListener('wheel',ev=>{ev.preventDefault();const r=stage.getBoundingClientRect();zoom(ev.deltaY<0?1.1:.9,ev.clientX-r.left,ev.clientY-r.top)},{passive:false});
addEventListener('keydown',ev=>{
  if(ev.target.isContentEditable){if(ev.key=='Enter'||ev.key=='Escape'){ev.preventDefault();ev.target.blur()}return}
  if(ev.target.tagName=='INPUT'){if(ev.key=='Enter')generate();return}
  if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()=='z'){ev.preventDefault();go(ev.shiftKey?1:-1);return}
  if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()=='y'){ev.preventDefault();go(1);return}
  if(ev.key=='Tab'){ev.preventDefault();addChild()}else if(ev.key=='Enter'){ev.preventDefault();addSib()}
  else if(ev.key=='Delete'||ev.key=='Backspace'){del()}});
// colors
PAL.forEach((c0,i)=>{const b=document.createElement('button');b.className='sw';b.style.background=c0;b.title='Color';
  b.onclick=()=>{const n=get(S.sel);if(!n||n.p==null)return;const c=PAL[i];n.c=c;kids(n.id).forEach(function r(k){k.c=c;kids(k.id).forEach(r)});render();save()};$('#cols').appendChild(b)});
// auto generate
const DEMO={topic:'Operating System',branches:[{name:'Process',children:['Scheduling','Threads','Deadlock']},{name:'Memory',children:['Paging','Segmentation','Virtual Memory']},{name:'File System',children:['Inodes','Directories','Allocation']},{name:'I/O',children:['Drivers','Interrupts','DMA']},{name:'Security',children:['Authentication','Permissions','Encryption']}]};
function build(d){
  const sh=$('#shape').value;uid=1;S.nodes=[{id:uid++,t:d.topic,s:sh,x:0,y:0,c:'#5b5bf0',p:null}];const root=S.nodes[0].id,B=d.branches.slice(0,8);
  B.forEach((b,i)=>{const a=i*2*Math.PI/B.length-Math.PI/2,col=PAL[i%5],id=uid++;
    S.nodes.push({id,t:b.name,s:sh,x:Math.round(260*Math.cos(a)),y:Math.round(260*Math.sin(a)),c:col,p:root});
    const ch=(b.children||[]).slice(0,5);
    ch.forEach((t,j)=>{const aa=a+(j-(ch.length-1)/2)*.3;S.nodes.push({id:uid++,t:String(t),s:sh,x:Math.round(500*Math.cos(aa)),y:Math.round(500*Math.sin(aa)),c:col,p:id})})});
  S.sel=root;render();save();center();S.v.k=.7;view()}
async function generate(){
  const t=$('#topic').value.trim();if(!t)return msg('Topic type pannunga 🙂');
  $('#gen').disabled=true;msg('Generating…');
  try{const sm=window.claude?await claude.use('sample'):null;
    if(!sm){build(/operating/i.test(t)?DEMO:{topic:t,branches:[{name:'Introduction',children:['What is it','History','Why it matters']},{name:'Key Concepts',children:['Core ideas','Terminology','Components']},{name:'Types',children:['Type 1','Type 2','Type 3']},{name:'Applications',children:['Real-world use','Industry','Daily life']},{name:'Pros & Cons',children:['Advantages','Limitations','Challenges']},{name:'Learn More',children:['Books','Videos','Practice']}]});msg('AI illa — basic template kaatturen, nodes-a edit pannunga ✏️');return}
    const d=await sm.json(`Create a mind map for the topic "${t}" for a college student. Reply with JSON only, exactly: {"topic":string,"branches":[{"name":string,"children":[string]}]}. Use 5 to 7 branches and 3 to 4 children each. Every label max 4 words.`);
    if(!d||!d.branches)throw 0;build(d);msg('Ready! Ippo edit pannalaam ✏️')}
  catch(e){msg('Generate aagala — thirumba try pannunga');}
  $('#gen').disabled=false}
function shp(g,s,x,y,w,h){g.beginPath();const l=x-w/2,t=y-h/2;
  if(s=='rect')g.roundRect(l,t,w,h,4);else if(s=='pill')g.roundRect(l,t,w,h,h/2);else if(s=='ellipse')g.ellipse(x,y,w/2,h/2,0,0,7);
  else if(s=='diamond'){g.moveTo(x,t);g.lineTo(l+w,y);g.lineTo(x,t+h);g.lineTo(l,y);g.closePath()}
  else if(s=='hex'){g.moveTo(l+w*.15,t);g.lineTo(l+w*.85,t);g.lineTo(l+w,y);g.lineTo(l+w*.85,t+h);g.lineTo(l+w*.15,t+h);g.lineTo(l,y);g.closePath()}
  else g.roundRect(l,t,w,h,14)}
// export
async function dl(name,data){try{const d=window.claude?await claude.use('downloads'):null;if(!d){const a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));a.download=name;a.click();return}await d.save({filename:name,data})}catch(e){msg('Download cancel aachu')}}
$('#json').onclick=()=>dl('mindmap.json',new Blob([JSON.stringify(S.nodes,null,2)],{type:'application/json'}));
$('#png').onclick=()=>{
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;const R={};
  S.nodes.forEach(n=>{const e=els[n.id],w=e.offsetWidth,h=e.offsetHeight;R[n.id]={w,h};x0=Math.min(x0,n.x-w/2);x1=Math.max(x1,n.x+w/2);y0=Math.min(y0,n.y-h/2);y1=Math.max(y1,n.y+h/2)});
  const m=40,sc=2,cv=document.createElement('canvas');cv.width=(x1-x0+2*m)*sc;cv.height=(y1-y0+2*m)*sc;const g=cv.getContext('2d');g.scale(sc,sc);
  g.fillStyle=getComputedStyle(document.body).backgroundColor;g.fillRect(0,0,cv.width,cv.height);g.translate(m-x0,m-y0);
  g.strokeStyle='#8b94b5';g.lineWidth=2.5;
  S.nodes.forEach(n=>{const p=get(n.p);if(p){const mx=(p.x+n.x)/2;g.beginPath();g.moveTo(p.x,p.y);if(LS)g.lineTo(n.x,n.y);else g.bezierCurveTo(mx,p.y,mx,n.y,n.x,n.y);g.stroke()}});
  g.textAlign='center';g.textBaseline='middle';
  S.nodes.forEach(n=>{const r=R[n.id],root=n.p==null;g.font=`600 ${root?18:15}px system-ui,sans-serif`;g.fillStyle=n.c;shp(g,n.s,n.x,n.y,r.w,r.h);g.fill();
    g.strokeStyle='rgba(0,0,0,.15)';g.lineWidth=2;g.stroke();g.fillStyle=root?'#fff':'#1d2233';g.fillText(n.t,n.x,n.y+1)});
  cv.toBlob(b=>dl('mindmap.png',b))};
const PS={Pastel:['#ffd6e0','#ffe8b8','#d4f5c9','#c9e6ff','#e0d4ff'],Sunset:['#ff9a8b','#ffb88c','#ffd97d','#f78fb3','#c56cf0'],Ocean:['#74b9ff','#81ecec','#55efc4','#a29bfe','#00cec9'],Forest:['#b8e994','#78e08f','#f6e58d','#badc58','#7ed6a5']};
function fit(){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;S.nodes.forEach(n=>{const e=els[n.id],w=e.offsetWidth,h=e.offsetHeight;x0=Math.min(x0,n.x-w/2);x1=Math.max(x1,n.x+w/2);y0=Math.min(y0,n.y-h/2);y1=Math.max(y1,n.y+h/2)});
  const k=Math.min(1.2,stage.clientWidth/(x1-x0+100),stage.clientHeight/(y1-y0+100));S.v={k,x:stage.clientWidth/2-k*(x0+x1)/2,y:stage.clientHeight/2-k*(y0+y1)/2};view()}
function arrange(){const r=S.nodes[0],cnt=n=>{const k=kids(n.id);return k.length?k.reduce((s,c)=>s+cnt(c),0):1};r.x=r.y=0;
  (function place(n,a,b,d){let s=a;kids(n.id).forEach(c=>{const w=(b-a)*cnt(c)/cnt(n),m=s+w/2;c.x=Math.round(Math.cos(m)*d*250);c.y=Math.round(Math.sin(m)*d*250);place(c,s,s+w,d+1);s+=w})})(r,-Math.PI/2,1.5*Math.PI,1);render();save();fit()}
$('#undo').onclick=()=>go(-1);$('#redo').onclick=()=>go(1);$('#arr').onclick=arrange;
$('#ls').onclick=()=>{LS=!LS;layout();$('#ls').textContent=LS?'╱ Straight':'〰 Curved'};
$('#pal').onchange=()=>{PAL.splice(0,5,...PS[$('#pal').value]);document.querySelectorAll('.sw').forEach((b,i)=>b.style.background=PAL[i]);
  kids(S.nodes[0].id).forEach((b,i)=>{const c=PAL[i%5];b.c=c;(function f(n){kids(n.id).forEach(k=>{k.c=c;f(k)})})(b)});render();save()};
// buttons
$('#shape').onchange=()=>{const n=get(S.sel);if(n){n.s=$('#shape').value;render();save()}};
$('#allsh').onclick=()=>{S.nodes.forEach(n=>n.s=$('#shape').value);render();save();msg('Ellaa nodes-um mathiyaachu')};
$('#gen').onclick=generate;$('#add').onclick=()=>addChild();$('#sib').onclick=addSib;$('#del').onclick=del;
$('#zi').onclick=()=>zoom(1.2);$('#zo').onclick=()=>zoom(.83);$('#fit').onclick=fit;
$('#clr').onclick=()=>{fresh();render();save();center();msg('Blank map ready')};
$('#th').onclick=()=>{const r=document.documentElement,dk=getComputedStyle(r).getPropertyValue('--bg').trim()=='#12141c';r.dataset.theme=dk?'light':'dark'};
if(!load())fresh('My Topic');render();center();commit();
</script></body></html>
